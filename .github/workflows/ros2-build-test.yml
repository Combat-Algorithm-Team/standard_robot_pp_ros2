name: ROS2 Humble Build & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository into ROS workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: src/standard_robot_pp_ros2

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool \
            ros-dev-tools

      - name: Import required external dependencies
        run: |
          cat > /tmp/required.repos <<'EOF'
          repositories:
            combat_rm_interfaces:
              type: git
              url: https://github.com/SMBU-PolarBear-Robotics-Team/combat_rm_interfaces.git
              version: main
          EOF
          vcs import src < /tmp/required.repos

      - name: Install rosdep dependencies for build/test
        run: |
          source /opt/ros/humble/setup.bash
          sudo rosdep init || true
          rosdep update
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro humble \
            --dependency-types buildtool build build_export test \
            --skip-keys "pb2025_robot_description" \
            -r -y

      - name: Build workspace (symlink install)
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --symlink-install \
            --packages-up-to standard_robot_pp_ros2 \
            --event-handlers console_direct+

      - name: Run tests
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test \
            --packages-select standard_robot_pp_ros2 \
            --event-handlers console_direct+
          colcon test-result \
            --all \
            --verbose \
            --test-result-base build/standard_robot_pp_ros2

      - name: Upload build/test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: standard-robot-pp-ros2-build-logs
          path: |
            log/latest_build/**
            build/standard_robot_pp_ros2/Testing/**
          if-no-files-found: warn
